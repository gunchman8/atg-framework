# ATGF Model Routing Guidance

# Models are selected by role capability, not maximum power.

routing:

  architect:
    capability:
      - reasoning
      - system_design
      - tradeoff_analysis
    preferred:
      - advanced_reasoning_model

  developer:
    capability:
      - coding
      - debugging
      - implementation
    preferred:
      - coding_model

  reviewer:
    capability:
      - criticism
      - security_review
      - quality_analysis
    preferred:
      - reasoning_model

  tester:
    capability:
      - validation
      - repetitive_checks
    preferred:
      - fast_reliable_model

provider_mapping:
  note: "Map capabilities to available providers in your environment."
  examples:
    - provider: Codex
      mapping: "Use suitable reasoning/coding models available in Codex."
    - provider: Claude
      mapping: "Use suitable reasoning/coding models available in Claude Code."
    - provider: Gemini
      mapping: "Use suitable reasoning/coding models available in Gemini environments."

policy:
  default_effort: balanced
  escalation:
    condition:
      - complex_architecture
      - critical_security
      - difficult_debugging
    action: increase_effort_with_human_approval

principle:
  - "Role first"
  - "Permission second"
  - "Model third"
  - "Effort last"
